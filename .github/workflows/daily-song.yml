name: Daily Song

on:
  schedule:
    # Collect /start and /stop messages as often as GitHub allows, so a new
    # subscriber is greeted in minutes rather than waiting for the evening run.
    # Five minutes is the platform minimum; triggers are still best-effort.
    - cron: "*/5 * * * *"
    # GitHub cron is UTC and best-effort: a trigger routinely fires 20-70
    # minutes late, and the top of the hour is the most congested slot. So we
    # ask several times at :07, and the job publishes on the first one that
    # lands at or after 20:00 local; --once-per-day makes the rest no-ops.
    # This also absorbs Israel's twice-yearly clock change: in winter the
    # 17:07 UTC slot is 19:07 local and skips, and 18:07 UTC publishes.
    - cron: "7 17 * * *"
    - cron: "7 18 * * *"
    - cron: "7 19 * * *"
    - cron: "7 20 * * *"
  workflow_dispatch:
    inputs:
      ignore_local_hour:
        description: "Publish now, without waiting for 20:00 local time"
        type: boolean
        default: true

# Runs queue instead of overlapping: both the subscriber sync and the daily
# post write to the same SQLite file and commit it back.
concurrency:
  group: daily-song
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The agent retries an overloaded API with a long backoff, so a healthy run
    # can take a few minutes. This is the ceiling before something is wrong.
    timeout-minutes: 30
    permissions:
      contents: write # so the subscriber list and song history can be committed

    env:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      # Optional: leave these secrets unset to keep Facebook publishing off.
      FACEBOOK_ENABLED: ${{ secrets.FACEBOOK_PAGE_ID != '' }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}
      TIMEZONE: Asia/Jerusalem
      DATABASE_PATH: storage/music_agent.db
      LOG_LEVEL: INFO

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Welcome new subscribers and remove those who left
        timeout-minutes: 5
        run: python main.py sync-subscribers

      - name: Publish the daily song
        # The frequent trigger only collects subscribers; publishing belongs to
        # the evening slots and to manual runs.
        if: github.event.schedule != '*/5 * * * *'
        timeout-minutes: 25
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             && [ "${{ inputs.ignore_local_hour }}" = "true" ]; then
            python main.py run-once --once-per-day
          else
            python main.py run-once --once-per-day --not-before-hour 20
          fi

      - name: Commit the subscriber list and song history
        run: |
          if [ -n "$(git status --porcelain storage/)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add storage/
            git commit -m "chore: update subscribers and published songs"
            # Runs are serialised by the concurrency group, so the remote should
            # not have moved. If it did, fail loudly rather than pick a side of
            # a binary database and silently drop a subscriber.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          else
            echo "Nothing changed; nothing to commit."
          fi

      - name: Report the failure to Telegram
        if: failure()
        continue-on-error: true
        run: |
          curl -sS --max-time 30 \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ ההרצה היומית נכשלה. הלוג: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            > /dev/null
